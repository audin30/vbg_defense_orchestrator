services:
  postgres:
    image: postgres:16
    container_name: orchestrator-postgres
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
    ports:
      # Host 5433 -> container 5432: this machine already runs a native
      # Postgres on the default 5432 (e.g. /Library/PostgreSQL), so the
      # orchestrator's container is offset to avoid the conflict.
      - "5433:5432"
    volumes:
      - orchestrator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orchestrator_pgdata:
